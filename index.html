<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Битва за Україну: Лінія дронів</title>
    <meta name="description" content="Покрокова стратегія на карті Східної Європи: фронт, дрони, далекобійні удари та гонка технологій." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='32' fill='%230057b8'/%3E%3Crect y='32' width='64' height='32' fill='%23ffd700'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <header id="topbar"></header>
      <main id="layout">
        <section id="mapwrap">
          <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
          <div id="zoomctl">
            <button data-zoom="in" title="Наблизити (+)">+</button>
            <button data-zoom="out" title="Віддалити (−)">−</button>
            <button data-zoom="reset" title="Скинути (0)">⌂</button>
            <button data-zoom="facilities" title="Показати/сховати об’єкти (F)" id="btn-fac">🏭</button>
          </div>
          <div id="maptip" hidden></div>
          <div id="actionbar"></div>
          <div id="ticker"><div id="ticker-inner"></div></div>
        </section>
        <aside id="side"></aside>
      </main>
      <div id="modal-root"></div>
      <div id="toast-root"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
